services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./BackEnd/config/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build: ./BackEnd
    ports:
      - "5001:5001"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_URL: http://localhost:5174
      PORT: 5001
    depends_on:
      - postgres

  frontend:
    build: ./FrontEnd
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  pgdata: